# Reusable workflow: every GlassineOS repository calls it on push and pull request.
#
#   jobs:
#     safety:
#       uses: GlassineOS/.github/.github/workflows/safety-scan.yml@main
#       secrets: inherit
name: safety-scan

on:
  workflow_call:
    secrets:
      # Read-only token for GlassineOS/.github while it is private (callers pass
      # `secrets: inherit`). Without it the default token is used, which is all a
      # public .github needs: delete the org secret then, nothing else changes.
      GLASSINE_ORG_READ:
        required: false
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: GlassineOS/.github
          path: .glassine-org
          token: ${{ secrets.GLASSINE_ORG_READ || github.token }}
      - name: Scan the whole history
        run: bash .glassine-org/scripts/safety-scan.sh --all
