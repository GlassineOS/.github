# Reusable workflow: every GlassineOS repository calls it on push and pull request.
#
#   jobs:
#     safety:
#       uses: GlassineOS/.github/.github/workflows/safety-scan.yml@main
#       secrets: inherit
name: safety-scan

on:
  workflow_call:
    secrets:
      # Optional read-only token, only needed if GlassineOS/.github were private.
      # It is public, so the default token is used (verified 2026-10-03).
      GLASSINE_ORG_READ:
        required: false
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: GlassineOS/.github
          path: .glassine-org
          token: ${{ secrets.GLASSINE_ORG_READ || github.token }}
      - name: Scan the whole history
        run: bash .glassine-org/scripts/safety-scan.sh --all
